name: Dependency CI retry

on:
  workflow_run:
    workflows: [CI, Docs]
    types: [completed]
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

# Serialize the completion hook and daily catch-up so they cannot spend the same retry twice.
concurrency:
  group: dependency-ci-retry
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event_name != 'workflow_run' ||
      ((github.event.workflow_run.event == 'pull_request' ||
      (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'maintenance/npm-lockfile')) &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/') ||
      github.event.workflow_run.head_branch == 'maintenance/npm-lockfile'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This workflow has a write token: never check out or execute the PR's code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Retry transient failures on current npm Dependabot commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/retry-dependency-ci.cjs
