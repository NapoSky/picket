# Deploy with `./rollout.sh <image>` (see the script). The `picket` service has no `container_name` or published port:
# docker-rollout must allow two replicas to coexist during the switch. Only Traefik publishes port 443.
name: picket

x-picket-environment: &picket-environment
  NODE_ENV: production
  TZ: ${TZ:-Europe/Paris}
  STATS_ADMIN_REFRESH_CRON: ${STATS_ADMIN_REFRESH_CRON:-0 0,12 * * *}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PICKET_VERSION: ${PICKET_IMAGE:?set PICKET_IMAGE}
  # Traefik removes a draining replica before its HTTP listener closes.
  SHUTDOWN_DRAIN_MS: "15000"
  WAR_API_URL: ${WAR_API_URL:-https://war-service-live.foxholeservices.com}
  WAR_LOG_POLL_INTERVAL: ${WAR_LOG_POLL_INTERVAL:-15}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DISCORD_REST_GLOBAL_RPS: ${DISCORD_REST_GLOBAL_RPS:-20}
  DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?set DISCORD_APPLICATION_ID in .env}
  DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:?set DISCORD_PUBLIC_KEY in .env}
  DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_bot_token
  DATABASE_URL_FILE: /run/secrets/database_url
  GUILD_RETENTION_DAYS: ${GUILD_RETENTION_DAYS:-30}
  SHARD_COUNT: ${SHARD_COUNT:-1}
  STATS_BUFFER_PATH: /app/data/voice-buffer
  STATS_BUFFER_MAX_MIB: ${STATS_BUFFER_MAX_MIB:-128}
  DASHBOARD_URL: "${DASHBOARD_HOST:+https://}${DASHBOARD_HOST:-}"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Stack HTTPS entrypoint: port 443 only (no port 80; Cloudflare handles redirects), with Let's Encrypt certificates
  # obtained through the Cloudflare DNS-01 challenge. Reads Docker labels from the other services.
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "443:443"
    environment:
      TZ: ${TZ:-Europe/Paris}
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_dns_token
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.format=json
      - --ping=true
      - --entrypoints.metrics.address=:8083
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=picket_edge
      - --entrypoints.https.address=:443
      # Cloudflare ranges (https://www.cloudflare.com/ips/): the only trusted sources for X-Forwarded-* headers.
      - --entrypoints.https.forwardedHeaders.trustedIPs=103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,104.16.0.0/13,104.24.0.0/14,108.162.192.0/18,131.0.72.0/22,141.101.64.0/18,162.158.0.0/15,172.64.0.0/13,173.245.48.0/20,188.114.96.0/20,190.93.240.0/20,197.234.240.0/22,198.41.128.0/17
      - --certificatesresolvers.certbot.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.certbot.acme.dnschallenge.delaybeforecheck=0
      - --certificatesresolvers.certbot.acme.storage=/letsencrypt/acme.json
    secrets:
      - cloudflare_dns_token
    volumes:
      - traefik-acme:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: picket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PICKET_MIGRATOR_PASSWORD_FILE: /run/secrets/picket_migrator_password
      PICKET_APP_PASSWORD_FILE: /run/secrets/picket_app_password
      PICKET_MONITOR_PASSWORD_FILE: /run/secrets/picket_monitor_password
    secrets:
      - postgres_password
      - picket_migrator_password
      - picket_app_password
      - picket_monitor_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./postgres/monitoring-role.sh:/opt/picket/monitoring-role.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d picket"]
      interval: 10s
      timeout: 5s
      retries: 5

  picket:
    image: ${PICKET_IMAGE:?set PICKET_IMAGE}
    init: true
    restart: unless-stopped
    <<: *hardening
    environment:
      <<: *picket-environment
      ROLES: http-ingress,shard-runner,job-runner,warlog-poller
    secrets:
      - discord_bot_token
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - voice-buffer:/app/data/voice-buffer
    stop_grace_period: 45s
    networks:
      - internal
      - edge
    healthcheck: &picket-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.docker.network: picket_edge
      # Only Discord interactions are exposed on the bot. Health and metrics remain internal.
      traefik.http.routers.picket.rule: Host(`${PICKET_HOST:?set PICKET_HOST}`) && Path(`/interactions`) && Method(`POST`)
      traefik.http.routers.picket.service: picket
      traefik.http.routers.picket.entrypoints: https
      traefik.http.routers.picket.tls.certresolver: certbot
      traefik.http.services.picket.loadbalancer.server.port: "8080"

  # Dedicated HTTP process and event loop. Collection remains in the bot.
  # With no DASHBOARD_HOST, only the internal health endpoint runs (no SQL pool).
  picket-stats:
    image: ${PICKET_IMAGE:?set PICKET_IMAGE}
    init: true
    restart: unless-stopped
    <<: *hardening
    command: ["node", "apps/stats/dist/main.js"]
    environment:
      <<: *picket-environment
      DASHBOARD_POOL_MAX: ${DASHBOARD_POOL_MAX:-2}
      DISCORD_CLIENT_SECRET_FILE: /run/secrets/discord_client_secret
    secrets:
      - discord_bot_token
      - discord_client_secret
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - voice-buffer:/app/data/voice-buffer
    stop_grace_period: 45s
    networks:
      - internal
      - edge
    healthcheck: *picket-healthcheck
    labels:
      traefik.enable: "true"
      traefik.docker.network: picket_edge
      traefik.http.routers.picket-dashboard.rule: Host(`${DASHBOARD_HOST:-dashboard-disabled.invalid}`)
      traefik.http.routers.picket-dashboard.service: picket-dashboard
      traefik.http.routers.picket-dashboard.entrypoints: https
      traefik.http.routers.picket-dashboard.tls.certresolver: "${DASHBOARD_HOST:+certbot}"
      traefik.http.services.picket-dashboard.loadbalancer.server.port: "8082"

  # One-off tasks: `docker compose run --rm migrate`.
  # Backup tools stay in their own image. Store only an age PUBLIC recipient on this host.
  # backup.sh and rollout.sh supply UID/GID dynamically; create BACKUP_DIR as the deployment user.
  backup:
    image: picket-postgres-backup:18
    build:
      context: ./backup
      args:
        PICKET_VERSION: ${PICKET_IMAGE:?set PICKET_IMAGE}
    profiles: [tools]
    restart: unless-stopped
    init: true
    <<: *hardening
    user: "${PICKET_BACKUP_UID:-1000}:${PICKET_BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      PGDATABASE: picket
      PGCONNECT_TIMEOUT: "10"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_SOURCE_IMAGE: ${BACKUP_SOURCE_IMAGE:-${PICKET_IMAGE}}
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-../backups}
        target: /backups
        bind:
          create_host_path: false
    secrets:
      - postgres_password
      - backup_recipients
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,time; assert time.time()-float(pathlib.Path('/backups/.last-success').read_text()) < 26*3600"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 5m

  migrate:
    image: ${PICKET_IMAGE:?set PICKET_IMAGE}
    profiles: [tools]
    restart: "no"
    <<: *hardening
    command: ["node", "apps/bot/dist/cli.js", "migrate"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PICKET_VERSION: ${PICKET_IMAGE:?set PICKET_IMAGE}
      DATABASE_MIGRATOR_URL_FILE: /run/secrets/database_migrator_url
    secrets:
      - database_migrator_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  deploy-commands:
    image: ${PICKET_IMAGE:?set PICKET_IMAGE}
    profiles: [tools]
    restart: "no"
    <<: *hardening
    command: ["node", "apps/bot/dist/cli.js", "deploy-commands"]
    environment:
      <<: *picket-environment
    secrets:
      - discord_bot_token
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - edge

  # Permanently delete data for guilds past their retention period.
  # Also runs nightly around 03:00 in TZ in the job-runner; exits with code 1 if any guild purge fails.
  purge:
    image: ${PICKET_IMAGE:?set PICKET_IMAGE}
    profiles: [tools]
    restart: "no"
    <<: *hardening
    command: ["node", "apps/bot/dist/cli.js", "purge"]
    environment:
      <<: *picket-environment
    volumes:
      - voice-buffer:/app/data/voice-buffer
    secrets:
      - discord_bot_token
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  restore:
    image: picket-postgres-backup:18
    profiles: [tools]
    restart: "no"
    <<: *hardening
    user: "0:0"
    cap_add: [DAC_READ_SEARCH]
    entrypoint: [bash, /opt/picket-backup/restore.sh]
    environment:
      PGHOST: postgres
      PGDATABASE: picket
      PGCONNECT_TIMEOUT: "10"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - type: bind
        source: ${RESTORE_ARCHIVE_DIR:-./secrets}
        target: /restore/archive
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RESTORE_IDENTITY_FILE:-./secrets/backup_identity}
        target: /restore/identity
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]

  # Enable with COMPOSE_PROFILES=monitoring in .env. Only Grafana has a public route.
  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    mem_limit: 768m
    entrypoint: [sh, /etc/picket/grafana-start.sh]
    environment:
      GF_SERVER_ROOT_URL: https://${MONITORING_HOST:-monitoring-disabled.invalid}
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PATHS_LOGS: /tmp
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GF_METRICS_ENABLED: "false"
      MONITORING_HOST: ${MONITORING_HOST:-}
      MONITORING_DISCORD_WEBHOOK_URL: ${MONITORING_DISCORD_WEBHOOK_URL:-}
    secrets: [grafana_admin_user, grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana-start.sh:/etc/picket/grafana-start.sh:ro
    networks: [internal, edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: picket_edge
      traefik.http.routers.picket-monitoring.rule: Host(`${MONITORING_HOST:-monitoring-disabled.invalid}`)
      traefik.http.routers.picket-monitoring.entrypoints: https
      traefik.http.routers.picket-monitoring.tls.certresolver: "${MONITORING_HOST:+certbot}"
      traefik.http.services.picket-monitoring.loadbalancer.server.port: "3000"

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    mem_limit: 768m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    networks: [internal]

  loki:
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    mem_limit: 1g
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - loki-data:/loki
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
    networks: [internal]

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    # Root reads Docker's socket; the image's Alloy group owns its persistent directory.
    user: "0:473"
    mem_limit: 512m
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    environment:
      PICKET_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-picket}
    volumes:
      - alloy-data:/var/lib/alloy
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128m
    pid: host
    command: [--path.rootfs=/host, --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)]
    volumes:
      - /:/host:ro
    networks: [internal]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128m
    environment:
      DATA_SOURCE_URI: postgres:5432/picket?sslmode=disable
      DATA_SOURCE_USER: picket_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/picket_monitor_password
    secrets: [picket_monitor_password]
    networks: [internal]

  operations-exporter:
    image: picket-postgres-backup:18
    build:
      context: ./backup
    profiles: [monitoring]
    restart: unless-stopped
    <<: *hardening
    user: "0:0"
    # Read the operator-owned (0700) backup directory; mounts themselves remain read-only.
    cap_add: [DAC_READ_SEARCH]
    mem_limit: 128m
    entrypoint: [python3, /opt/picket-monitoring/exporter.py]
    environment:
      PICKET_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-picket}
    volumes:
      - ./monitoring/exporter.py:/opt/picket-monitoring/exporter.py:ro
      - operations-state:/state
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${BACKUP_DIR:-../backups}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]

networks:
  internal:
    internal: true
  # Traefik and services that need to reach Discord (Internet access). Explicit name: Traefik matches the actual Docker
  # network name (including the project prefix); a wrong name makes it choose an arbitrary address.
  edge:
    name: picket_edge

volumes:
  pgdata:
  traefik-acme:
  voice-buffer:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
  operations-state:

secrets:
  backup_recipients:
    file: ./secrets/backup_recipients
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  picket_monitor_password:
    file: ./secrets/picket_monitor_password
  postgres_password:
    file: ./secrets/postgres_password
  picket_migrator_password:
    file: ./secrets/picket_migrator_password
  picket_app_password:
    file: ./secrets/picket_app_password
  database_url:
    file: ./secrets/database_url
  database_migrator_url:
    file: ./secrets/database_migrator_url
  discord_bot_token:
    file: ./secrets/discord_bot_token
  discord_client_secret:
    file: ./secrets/discord_client_secret
  cloudflare_dns_token:
    file: ./secrets/cloudflare_dns_token
