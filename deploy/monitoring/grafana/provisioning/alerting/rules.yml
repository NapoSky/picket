          "noDataState": "OK",
          "execErrState": "Alerting",
          "annotations": {
            "summary": "Bot unavailable",
            "description": "Check container health, logs and PostgreSQL; restart the failed service after identifying the cause.",
            "runbook_url": "https://docs.picket-foxhole.com/self-hosting/monitoring",
            "__dashboardUid__": "picket-overview",
            "__panelId__": "6"
          },
          "labels": {
            "severity": "critical",
            "scope": "picket"
          },
          "isPaused": false,
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "picket-prometheus",
              "model": {
                "refId": "A",
                "expr": "picket:incident:bot_unavailable",
                "instant": true,
                "range": false,
                "intervalMs": 30000,
                "maxDataPoints": 1000
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
