<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-labelledby="title description">
  <title id="title">Add PICKET to Discord</title>
  <desc id="description">Your regiment. In sync. Todo lists, timers and a shared watch. Click this banner to add PICKET to your server.</desc>
