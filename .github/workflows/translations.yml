name: Merge translations

# Weblate opens pull requests restricted to locale files. `pull_request_target` runs with repository
# permissions: this workflow NEVER checks out PR code; it only calls the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    # Trigger only for locale files: avoid a skipped job on every unrelated PR.
    paths:
      - packages/i18n/locales/**

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Set this repository variable to the account opening Weblate PRs; without it, nothing merges.
    if: vars.WEBLATE_BOT_LOGIN != '' && github.event.pull_request.user.login == vars.WEBLATE_BOT_LOGIN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only translation files changed?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^packages/i18n/locales/[A-Za-z-]+\.json$'; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Merge only after branch-protection checks, including CI, pass.
      - name: Enable auto-merge
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash
