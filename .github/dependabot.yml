version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Même politique que minimumReleaseAge de pnpm : pas de version publiée depuis moins de 3 jours.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Une seule pull request pour toutes les actions, plutôt qu'une par action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # On reste sur la version LTS de Node (24) ; les mises à jour de version majeure se décident à la main.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
