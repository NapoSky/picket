version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same policy as pnpm minimumReleaseAge: exclude releases less than 3 days old.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for all actions, instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Stay on Node LTS (24); decide major-version upgrades manually.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
