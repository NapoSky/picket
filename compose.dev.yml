# Postgres local pour le développement : `docker compose -f compose.dev.yml up -d --wait`
# Mots de passe de développement uniquement ; ne jamais réutiliser en production.
name: picket-dev
services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: picket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PICKET_MIGRATOR_PASSWORD: migrator
      PICKET_APP_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d picket"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
