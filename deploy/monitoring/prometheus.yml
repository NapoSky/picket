global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: picket
    dns_sd_configs:
      - names: [picket]
        type: A
        port: 8081
        refresh_interval: 15s
  - job_name: picket-stats
    dns_sd_configs:
      - names: [picket-stats]
        type: A
        port: 8081
        refresh_interval: 15s
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: operations
    static_configs:
      - targets: [operations-exporter:9101]
  - job_name: traefik
    static_configs:
      - targets: [traefik:8083]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
