{
  "apiVersion": 1,
  "contactPoints": [
    {
      "orgId": 1,
      "name": "PICKET Discord",
      "receivers": [
        {
          "uid": "picket-discord",
          "type": "discord",
          "disableResolveMessage": false,
          "settings": {
            "url": "$MONITORING_DISCORD_WEBHOOK_URL",
            "use_discord_username": false,
            "title": "PICKET \u2014 {{ .Status }}",
            "message": "{{ range .Alerts }}**{{ .Annotations.summary }}**\n{{ .Annotations.description }}\nService: {{ .Labels.scope }} / {{ .Labels.service }} / {{ .Labels.component }}\nSeverity: {{ .Labels.severity }}\n{{ .DashboardURL }}\n{{ .Annotations.runbook_url }}\n{{ end }}"
          }
        }
      ]
    }
  ],
  "policies": [
    {
      "orgId": 1,
      "receiver": "PICKET Discord",
      "group_by": [
        "grafana_folder",
        "alertname",
        "service",
        "component",
        "job"
      ],
      "group_wait": "30s",
      "group_interval": "5m",
      "repeat_interval": "4h"
    }
  ]
}
